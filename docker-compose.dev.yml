version: '3.8'

services:
  # Development frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - server

  # Development backend server service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
      - attire-data:/app/data
      - attire-uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=3001